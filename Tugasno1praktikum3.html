<!DOCTYPE html>
<html>
<head>
    <title>Formulir Pendaftaran Praktikan</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg,#74ebd5,#acb6e5);
        }

        .form-box{
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        label{
            display: block;
            margin-top: 10px;
        }

        input, select, textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .radio, .checkbox{
            margin-top:5px;
        }

        button{
            margin-top:15px;
            padding:8px 15px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .submit{
            background:green;
            color:white;
        }

        .cancel{
            background:red;
            color:white;
        }

        .nim{
            font-size:14px;
            color:gray;
            margin-bottom:10px;
        }

    </style>
</head>

<body>

<div class="form-box">

<h2>Formulir Pendaftaran Praktikan</h2>

<form>

<label>Nama</label>
<input type="text" placeholder="Masukkan Nama">

<div class="nim">
NIM : 2311102289
</div>

<label>Username</label>
<input type="text" placeholder="Masukkan Username">

<label>Password</label>
<input type="password">

<label>Email</label>
<input type="email" placeholder="Input Email">

<label>Jenis Kelamin</label>
<div class="radio">
<input type="radio" name="jk"> Pria
<input type="radio" name="jk"> Wanita
</div>

<label>Hobi</label>
<div class="checkbox">
<input type="checkbox"> Renang <br>
<input type="checkbox"> Bersepeda <br>
<input type="checkbox"> Memancing
</div>

<label>Jenjang Pendidikan</label>
<select>
<option>Pilih</option>
<option>Tamat D3</option>
<option>Tamat S1</option>
<option>Tamat S2</option>
<option>Tamat S3</option>
</select>

<label>Kritik & Saran</label>
<textarea rows="4"></textarea>

<br>

<button type="reset" class="cancel">Cancel</button>
<button type="submit" class="submit">Submit</button>

</form>

</div>

</body>
</html>
